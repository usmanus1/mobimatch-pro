name: MobiMatch Pro Auto-Research, SEO & Bing IndexNow

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * *' # Rozana subah auto-run hoga
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-sync-and-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Research Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Auto-Research & Sitemap Sync
        run: python auto_sync_research.py

      - name: Commit Updated Sitemap & Research Drafts
        run: |
          git config user.name "MobiMatch Bot"
          git config user.email "bot@mobimatchpro.com"
          git add sitemap.xml research-drafts.json || true
          git diff --staged --quiet || git commit -m "chore(auto-sync): daily research draft & sitemap update"
          git push

      - name: Ping Bing IndexNow (Instant Indexing)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d '{
            "host": "www.mobimatchpro.com",
            "key": "mobimatchpro2026indexnow",
            "keyLocation": "https://www.mobimatchpro.com/mobimatchpro2026indexnow.txt",
            "urlList": [
              "https://www.mobimatchpro.com/",
              "https://www.mobimatchpro.com/about",
              "https://www.mobimatchpro.com/contact",
              "https://www.mobimatchpro.com/sitemap.xml"
            ]
          }'

      - name: Google Lighthouse SEO & Speed Audit
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            https://www.mobimatchpro.com/
          temporaryPublicStorage: true
